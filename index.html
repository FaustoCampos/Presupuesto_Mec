<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización del Dólar</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        width: 90%;
        max-width: 500px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .card {
        background: #f8f9fa;
        border-left: 5px solid #28a745;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
    }

    .nombre {
        font-size: 18px;
        font-weight: bold;
        color: #222;
    }

    .precio {
        font-size: 22px;
        margin-top: 8px;
        color: #28a745;
    }

    .actualizacion {
        text-align: center;
        margin-top: 15px;
        color: #666;
        font-size: 14px;
    }

    .error {
        color: red;
        text-align: center;
    }
</style>
</head>
<body>

<div class="container">
    <h1>💵 Cotización del Dólar</h1>

    <div id="cotizaciones">
        Cargando datos...
    </div>

    <div class="actualizacion" id="hora"></div>
</div>

<script>
async function cargarCotizaciones() {
    try {
        const respuesta = await fetch("https://dolarapi.com/v1/dolares");

        if (!respuesta.ok) {
            throw new Error("No se pudo obtener la información");
        }

        const datos = await respuesta.json();

        const contenedor = document.getElementById("cotizaciones");

        contenedor.innerHTML = "";

        datos.forEach(dolar => {
            contenedor.innerHTML += `
                <div class="card">
                    <div class="nombre">${dolar.nombre}</div>
                    <div class="precio">
                        Compra: $${dolar.compra ?? "-"}<br>
                        Venta: $${dolar.venta ?? "-"}
                    </div>
                </div>
            `;
        });

        document.getElementById("hora").innerHTML =
            "Última actualización: " +
            new Date().toLocaleTimeString();

    } catch (error) {
        document.getElementById("cotizaciones").innerHTML =
            `<p class="error">Error al cargar las cotizaciones</p>`;

        console.error(error);
    }
}

cargarCotizaciones();

// Actualiza cada 15 segundos
setInterval(cargarCotizaciones, 15000);
</script>

</body>
</html>
